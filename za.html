<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برا السالفة - النسخة الشاملة الرمضانية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-blue: #1a2a6c;
            --bg-orange: #f39c12;
            --card-bg: #ffffff;
            --text-dark: #2d3436;
            --ramadan-gold: #ffd700;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 15px; overflow-x: hidden;
        }

        .lantern {
            position: fixed; top: -10px; font-size: 35px; color: var(--ramadan-gold);
            animation: swing 3s ease-in-out infinite; transform-origin: top center; z-index: 1000;
        }
        .lantern-left { left: 15px; } .lantern-right { right: 15px; }
        @keyframes swing { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }

        .container {
            background: var(--card-bg); padding: 25px; border-radius: 30px;
            width: 100%; max-width: 500px; text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4); max-height: 90vh; overflow-y: auto;
            position: relative; border: 3px solid var(--ramadan-gold);
        }

        .categories-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .category-card {
            border-radius: 12px; padding: 15px; cursor: pointer; transition: 0.2s;
            border: 3px solid transparent; color: white; font-weight: 700; font-size: 15px;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .category-card i { font-size: 22px; }
        .category-card.selected { border-color: #2d3436; transform: scale(0.95); box-shadow: inset 0 0 10px rgba(0,0,0,0.2); }

        input { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #eee; margin-bottom: 10px; font-family: 'Cairo'; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 15px; border: none; font-weight: 700; font-size: 18px; cursor: pointer; background-color: var(--bg-orange); color: white; margin-top: 10px; }
        
        .game-display { padding: 25px; border-radius: 20px; color: white; min-height: 150px; display: flex; flex-direction: column; justify-content: center; margin-bottom: 15px; }
        .player-tag { background: #f0f2f5; padding: 5px 12px; border-radius: 20px; margin: 3px; display: inline-block; font-size: 13px; border: 1px solid #ddd; }
        
        .vote-btn { background: #f8f9fa; color: #2d3436; margin-bottom: 8px; border: 2px solid #eee; }
        .option-btn { background: #6c5ce7; color: white; font-size: 16px; margin: 5px 0; border-bottom: 4px solid #4834d4; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="lantern lantern-left"><i class="fa-solid fa-lightbulb"></i></div>
<div class="lantern lantern-right"><i class="fa-solid fa-lightbulb"></i></div>

<div class="container">
    <div id="setup-screen">
        <h2 style="color: var(--bg-blue); margin-bottom: 5px;"><i class="fa-solid fa-moon"></i> برا السالفة</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 15px;">النسخة الشاملة | خلك ذيب لا يكفشونك!</p>
        
        <input type="text" id="player-name" placeholder="اسم اللاعب...">
        <button onclick="addPlayer()" style="background: var(--bg-blue);">إضافة لاعب +</button>
        <div id="player-list" style="margin: 15px 0;"></div>
        
        <h3 style="border-top: 1px solid #eee; padding-top: 10px;">اختر الباقة:</h3>
        <div class="categories-grid" id="cats-grid">
            </div>
        <button onclick="startGame()" style="background: #2d3436; margin-top:20px; font-size: 22px;">ابدأ اللعب 🚀</button>
    </div>

    <div id="game-screen" class="hidden">
        <h2 id="current-player-name"></h2>
        <p>مرر الجوال لهذا الشخص</p>
        <button id="reveal-btn" onclick="reveal()">اكشف دوري 👀</button>
        <div id="role-result" class="hidden">
            <div id="display-box" class="game-display"></div>
            <button onclick="nextPlayer()" style="background: #2d3436;">فهمت، خبيت الكلمة</button>
        </div>
    </div>

    <div id="vote-screen" class="hidden">
        <h2>مين اللي برا السالفة؟ <i class="fa-solid fa-gavel"></i></h2>
        <div id="vote-options"></div>
    </div>

    <div id="guess-screen" class="hidden">
        <h2 style="color: #e67e22;">كفشوك! وش الكلمة؟</h2>
        <div id="word-options"></div>
    </div>

    <div id="end-screen" class="hidden">
        <h1 id="end-title"></h1>
        <div id="end-msg" class="game-display"></div>
        <button onclick="location.reload()" style="background: var(--bg-blue);">لعبة جديدة 🔄</button>
    </div>
</div>

<script>
    const data = {
        "جازان": ["مرسة", "مغش", "خمير", "حنيذ", "فل جازاني", "جبل فيفا", "فرسان", "لحوح", "وفد"],
        "أكلات رمضان": ["سمبوسة", "فيمتو", "لقيمات", "شوربة شوفان", "تمر", "قطايف", "هريس", "جريش"],
        "حيوانات": ["أسد", "فيل", "زرافة", "نمر", "قرد", "تمساح", "بطريق", "جمل", "ذئب", "ثعلب"],
        "أكلات": ["كبسة", "شاورما", "برجر", "بيتزا", "كنافة", "سوشي", "منسف", "مكرونة"],
        "رياضة": ["هدف", "كرة قدم", "سلة", "تسلل", "حارس", "مدرج", "حكم", "تنس"],
        "ملابس": ["ثوب", "شماغ", "فستان", "قميص", "بشت", "قبعة", "جاكيت", "جزمة"],
        "تقنية": ["آيفون", "قوقل", "واتساب", "لابتوب", "واي فاي", "شاحن", "تطبيق", "سناب شات"],
        "أماكن": ["مطار", "مستشفى", "حديقة", "مدرسة", "مول", "مسجد", "شاطئ", "فندق"],
        "ترفيه": ["سينما", "مسلسل", "لعبة", "فشار", "بلاستيشن", "يوتيوب", "نتفلكس", "تيك توك"],
        "مدرسة": ["قلم", "دفتر", "سبورة", "فسحة", "اختبار", "مدير", "طاولة", "مقصف"],
        "البيت": ["ثلاجة", "تلفزيون", "كنبة", "مطبخ", "سرير", "مكيف", "ستارة", "ساعة"],
        "مهن": ["طيار", "دكتور", "مهندس", "شرطي", "طباخ", "نجار", "محامي", "مدرس"],
        "سفر": ["جواز", "تذكرة", "شنطة سفر", "فندق", "قطار", "خريطة", "سياحة", "بحر"],
        "ماركات": ["نايك", "أديداس", "شانيل", "رولكس", "أبل", "سامسونج", "تويوتا", "زارا"]
    };

    const icons = {
        "جازان": "fa-mountain-sun", "أكلات رمضان": "fa-moon", "حيوانات": "fa-paw", 
        "أكلات": "fa-utensils", "رياضة": "fa-soccer-ball", "ملابس": "fa-shirt",
        "تقنية": "fa-laptop", "أماكن": "fa-map-location-dot", "ترفيه": "fa-film",
        "مدرسة": "fa-graduation-cap", "البيت": "fa-house", "مهن": "fa-briefcase",
        "سفر": "fa-plane", "ماركات": "fa-bag-shopping"
    };

    let players = [];
    let gameOrder = [];
    let selectedCat = "";
    let chosenWord = "";
    let impostorIndex = -1;
    let currentStep = 0;

    // توليد مربعات الفئات
    const grid = document.getElementById('cats-grid');
    Object.keys(data).forEach(cat => {
        const card = document.createElement('div');
        card.className = 'category-card';
        card.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0'); // لون عشوائي
        if(cat === "جازان") card.style.backgroundColor = "#27ae60";
        if(cat === "أكلات رمضان") card.style.backgroundColor = "#e67e22";
        
        card.innerHTML = `<i class="fa-solid ${icons[cat] || 'fa-star'}"></i> ${cat}`;
        card.onclick = () => selectCategory(cat, card);
        grid.appendChild(card);
    });

    function addPlayer() {
        const input = document.getElementById('player-name');
        if(input.value.trim()) {
            players.push(input.value.trim());
            document.getElementById('player-list').innerHTML += `<span class="player-tag">${input.value}</span>`;
            input.value = "";
        }
    }

    function selectCategory(cat, el) {
        selectedCat = cat;
        document.querySelectorAll('.category-card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
    }

    function startGame() {
        if(players.length < 3) return alert("سجل 3 لاعبين على الأقل!");
        if(!selectedCat) return alert("اختر باقة للعب!");
        
        chosenWord = data[selectedCat][Math.floor(Math.random() * data[selectedCat].length)];
        impostorIndex = Math.floor(Math.random() * players.length);
        
        // خلط الترتيب
        gameOrder = [...Array(players.length).keys()];
        gameOrder.sort(() => Math.random() - 0.5);
        
        currentStep = 0;
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        updateTurn();
    }

    function updateTurn() {
        let pIdx = gameOrder[currentStep];
        document.getElementById('current-player-name').innerText = "دور: " + players[pIdx];
        document.getElementById('reveal-btn').classList.remove('hidden');
        document.getElementById('role-result').classList.add('hidden');
    }

    function reveal() {
        document.getElementById('reveal-btn').classList.add('hidden');
        const res = document.getElementById('role-result');
        const box = document.getElementById('display-box');
        res.classList.remove('hidden');
        
        let pIdx = gameOrder[currentStep];
        if(pIdx === impostorIndex) {
            box.parentElement.style.backgroundColor = "#1a2a6c";
            box.innerHTML = `<div>أنت اللي برا السالفة! 🤫</div><div style="font-size:14px; margin-top:10px;">التصنيف: ${selectedCat}</div>`;
        } else {
            box.parentElement.style.backgroundColor = "#f39c12";
            box.innerHTML = `<div style="font-size:14px;">الكلمة هي:</div><div style="font-size:28px; font-weight:900;">${chosenWord}</div>`;
        }
    }

    function nextPlayer() {
        currentStep++;
        if(currentStep < players.length) updateTurn();
        else startVote();
    }

    function startVote() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('vote-screen').classList.remove('hidden');
        const container = document.getElementById('vote-options');
        container.innerHTML = "";
        players.forEach((p, idx) => {
            container.innerHTML += `<button class="vote-btn" onclick="checkVote(${idx})">${p}</button>`;
        });
    }

    function checkVote(idx) {
        document.getElementById('vote-screen').classList.add('hidden');
        if(idx === impostorIndex) showGuessOptions();
        else finishGame(false, `خسرتوا! اللي كان برا السالفة هو "${players[impostorIndex]}".. جحفلكم!`);
    }

    function showGuessOptions() {
        document.getElementById('guess-screen').classList.remove('hidden');
        const container = document.getElementById('word-options');
        let options = [chosenWord];
        let others = [...data[selectedCat]].filter(w => w !== chosenWord);
        for(let i=0; i<3; i++) {
            if(others.length > 0) options.push(others.splice(Math.floor(Math.random()*others.length), 1)[0]);
        }
        options.sort(() => Math.random() - 0.5);
        container.innerHTML = "";
        options.forEach(opt => {
            container.innerHTML += `<button class="option-btn" onclick="checkGuess('${opt}')">${opt}</button>`;
        });
    }

    function checkGuess(word) {
        document.getElementById('guess-screen').classList.add('hidden');
        if(word === chosenWord) finishGame(true, `فاز اللي برا السالفة! حزر الكلمة ذيب: ${chosenWord}`);
        else finishGame(false, `كفشتوه وما عرف الكلمة! الكلمة كانت: ${chosenWord}`);
    }

    function finishGame(isImpostorWin, msg) {
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('end-title').innerText = isImpostorWin ? "فوز اللي برا السالفة! 😎" : "فوز الجماعة! 🏆";
        document.getElementById('end-msg').innerText = msg;
        document.getElementById('end-msg').style.backgroundColor = isImpostorWin ? "#1a2a6c" : "#27ae60";
    }
</script>
</body>
</html>
